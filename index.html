<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EchoBoard Blog</title>
    <link
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.2/dist/sweetalert2.min.css"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="faviconimage/favicon.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="navbar">
        <h2>📝 EchoBoard Blog</h2>
        <div>
          <button class="btn" id="themeBtn">🌙</button>
          <button class="btn btn-danger hidden" id="logoutBtn">Logout</button>
        </div>
      </div>

      <div id="authSection" class="card">
        <h3 id="authTitle">Login</h3>
        <input
          type="text"
          id="username"
          placeholder="Username"
          class="hidden"
        />
        <input type="email" id="email" placeholder="Email" required />
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />
          <span class="toggle-password" id="togglePass">👁️</span>
        </div>
        <p class="error" id="authError"></p>
        <p class="success" id="authSuccess"></p>
        <button class="btn" id="authBtn">Login</button>
        <p style="margin-top: 15px">
          Don't have account?
          <a href="#" id="toggleAuth" style="color: #fff; font-weight: 600"
            >Sign Up</a
          >
        </p>
      </div>

      <div id="blogSection" class="hidden">
        <button class="btn" id="newPostBtn">+ Create New Post</button>
        <input
          type="text"
          id="searchBar"
          placeholder="🔍 Search posts by title..."
        />
        <div id="postForm" class="card hidden">
          <h3 id="formTitle">Create Post</h3>
          <input
            type="text"
            id="postTitle"
            placeholder="Post Title"
            maxlength="100"
            required
          />
          <div class="char-count"><span id="charCount">0</span>/500</div>
          <textarea
            id="postDesc"
            placeholder="Write your blog description..."
            rows="5"
            maxlength="500"
            required
          ></textarea>
          <p class="error" id="postError"></p>
          <button class="btn" id="savePostBtn">Save Post</button>
          <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
        </div>
        <div id="postsFeed"></div>
      </div>
    </div>

    <script type="module" src="firebase.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
